# Entorno LOCAL de desarrollo.
#
#   make bootstrap              # una vez: certificados TLS y secretos de desarrollo
#   docker compose up -d        # solo infraestructura (Valkey + Postgres)
#   docker compose --profile apps up -d --build   # todo el sistema en contenedores
#
# El despliegue real usa infra/swarm/docker-stack.yml (Fase 8).

name: sin-barreras

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Servicios de datos: arrancan como root solo para copiar el material TLS con
# el dueño correcto; después el entrypoint oficial baja a su usuario.
x-datastore-caps: &datastore-caps
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]

x-rust-service: &rust-service
  <<: *hardening
  profiles: [apps]
  read_only: true
  cap_drop: [ALL]
  user: "65532:65532"

services:
  valkey:
    image: valkey/valkey:9.1-alpine
    <<: [*hardening, *datastore-caps]
    entrypoint: ["/bin/sh", "/usr/local/bin/sb-start.sh"]
    volumes:
      - valkey-data:/data
      - ./infra/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - ./infra/valkey/start.sh:/usr/local/bin/sb-start.sh:ro
      - ./infra/dev/certs/ca.crt:/run/tls-src/ca.crt:ro
      - ./infra/dev/certs/valkey.crt:/run/tls-src/valkey.crt:ro
      - ./infra/dev/certs/valkey.key:/run/tls-src/valkey.key:ro
    secrets: [valkey_users_acl, valkey_healthcheck_password]
    ports: ["127.0.0.1:${SB_VALKEY_PORT:-16379}:6379"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          VALKEYCLI_AUTH="$$(cat /run/secrets/valkey_healthcheck_password)"
          valkey-cli --tls --cacert /tls/ca.crt --user healthcheck ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    <<: [*hardening, *datastore-caps]
    entrypoint: ["/bin/sh", "/usr/local/bin/sb-start.sh"]
    environment:
      POSTGRES_DB: sin_barreras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      # Locale provider `builtin` (Postgres 17+): orden de texto estable que no
      # depende de glibc/musl, así una actualización del SO no corrompe índices.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      - ./infra/postgres/start.sh:/usr/local/bin/sb-start.sh:ro
      - ./infra/postgres/initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./crates/registry/sql/roles.sql:/docker-entrypoint-initdb.d/roles.sql.inc:ro
      - ./infra/dev/certs/ca.crt:/run/tls-src/ca.crt:ro
      - ./infra/dev/certs/postgres.crt:/run/tls-src/postgres.crt:ro
      - ./infra/dev/certs/postgres.key:/run/tls-src/postgres.key:ro
    secrets:
      - postgres_superuser_password
      - postgres_migrator_password
      - postgres_record_writer_password
      - postgres_auditor_password
      - postgres_reporting_password
      - postgres_investigator_password
      - postgres_replicator_password
    shm_size: 256mb
    ports: ["127.0.0.1:${SB_POSTGRES_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sin_barreras"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Borde: mismo ruteo que en producción. `/` → PWA, `/ws` → BFF (2 réplicas).
  traefik:
    image: traefik:v3.7
    <<: *hardening
    profiles: [apps]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sin-barreras_default
      - --entrypoints.web.address=:8000
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      # POLÍTICA: los logs nunca contienen la IP del ciudadano.
      - --accesslog.fields.names.ClientAddr=drop
      - --accesslog.fields.names.ClientHost=drop
      - --accesslog.fields.names.ClientPort=drop
      - --accesslog.fields.names.ClientUsername=drop
      - --accesslog.fields.headers.defaultmode=drop
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["127.0.0.1:${SB_PORT:-8000}:8000"]
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bff:
    <<: *rust-service
    build:
      context: .
      dockerfile: infra/docker/rust.Dockerfile
      target: bff
    image: sin-barreras/bff:dev
    # Mínimo 2 réplicas: el BFF no guarda estado propio (todo vive en Valkey).
    deploy:
      replicas: 2
    environment:
      BFF_LISTEN_ADDR: 0.0.0.0:8080
      LOG_FORMAT: pretty
      VALKEY_URL: valkeys://valkey:6379
      VALKEY_USERNAME: bff
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_bff_password
      VALKEY_CA_FILE: /run/secrets/dev_ca
      C5_MOCK_URL: http://c5-mock:8090
      C5_MOCK_API_KEY_FILE: /run/secrets/c5_mock_api_key
      QR_KEYS_FILE: /run/secrets/qr_keys
      RECORD_PUBLIC_KEY_FILE: /run/secrets/record_public_key
      RECORD_OPERATIONAL_KEYS_FILE: /run/secrets/record_operational_keys
      ALLOWED_ORIGINS: http://localhost:${SB_PORT:-8000},http://localhost:5173
    secrets: [valkey_bff_password, dev_ca, c5_mock_api_key, qr_keys, record_public_key, record_operational_keys]
    labels:
      traefik.enable: "true"
      traefik.http.routers.bff.rule: Path(`/ws`) || PathPrefix(`/api/`)
      traefik.http.routers.bff.entrypoints: web
      traefik.http.services.bff.loadbalancer.server.port: "8080"
      traefik.http.services.bff.loadbalancer.healthcheck.path: /ready
      traefik.http.services.bff.loadbalancer.healthcheck.interval: 5s
    depends_on:
      valkey: { condition: service_healthy }
      c5-mock: { condition: service_healthy }

  record-writer:
    <<: *rust-service
    build:
      context: .
      dockerfile: infra/docker/rust.Dockerfile
      target: record-writer
    image: sin-barreras/record-writer:dev
    # 2 réplicas: si una muere, la otra reclama sus pendientes.
    deploy:
      replicas: 2
    environment:
      RECORD_WRITER_LISTEN_ADDR: 0.0.0.0:8081
      LOG_FORMAT: pretty
      VALKEY_URL: valkeys://valkey:6379
      VALKEY_USERNAME: record_writer
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_record_writer_password
      VALKEY_CA_FILE: /run/secrets/dev_ca
      PG_HOST: postgres
      PG_DATABASE: sin_barreras
      PG_USER: sb_writer
      PG_PASSWORD_FILE: /run/secrets/postgres_record_writer_password
      PG_CA_FILE: /run/secrets/dev_ca
      RECORD_WRITER_CHECKPOINT_SECS: "60"
    secrets: [valkey_record_writer_password, postgres_record_writer_password, dev_ca]
    depends_on:
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Aplica las migraciones (una vez) con el rol sb_migrator.
  migrate:
    <<: *rust-service
    restart: "no"
    build:
      context: .
      dockerfile: infra/docker/rust.Dockerfile
      target: sb-admin
    image: sin-barreras/sb-admin:dev
    command: ["migrate"]
    healthcheck:
      disable: true
    environment:
      PG_HOST: postgres
      PG_DATABASE: sin_barreras
      PG_USER: sb_migrator
      PG_PASSWORD_FILE: /run/secrets/postgres_migrator_password
      PG_CA_FILE: /run/secrets/dev_ca
    secrets: [postgres_migrator_password, dev_ca]
    depends_on:
      postgres: { condition: service_healthy }

  c5-mock:
    <<: *rust-service
    build:
      context: .
      dockerfile: infra/docker/rust.Dockerfile
      target: c5-mock
    image: sin-barreras/c5-mock:dev
    environment:
      C5_MOCK_LISTEN_ADDR: 0.0.0.0:8090
      C5_MOCK_API_KEY_FILE: /run/secrets/c5_mock_api_key
      LOG_FORMAT: pretty
    secrets: [c5_mock_api_key]
    # Expuesto solo en localhost para usar /mock-control en demos y pruebas.
    ports: ["127.0.0.1:${SB_C5_MOCK_PORT:-8090}:8090"]

  # Herramienta de administración bajo demanda (no corre sola):
  #   docker compose run --rm admin verify
  #   docker compose run --rm admin dlq list
  admin:
    <<: *rust-service
    profiles: [tools]
    restart: "no"
    image: sin-barreras/sb-admin:dev
    build:
      context: .
      dockerfile: infra/docker/rust.Dockerfile
      target: sb-admin
    healthcheck:
      disable: true
    environment:
      PG_HOST: postgres
      PG_DATABASE: sin_barreras
      PG_USER: sb_auditor
      PG_PASSWORD_FILE: /run/secrets/postgres_auditor_password
      PG_CA_FILE: /run/secrets/dev_ca
      VALKEY_URL: valkeys://valkey:6379
      VALKEY_USERNAME: admin
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_admin_password
      VALKEY_CA_FILE: /run/secrets/dev_ca
    secrets: [postgres_auditor_password, valkey_admin_password, dev_ca]

  # Investigación auditada (solo desarrollo: en producción la llave privada
  # NUNCA está en los servidores; se usa en un equipo fuera de línea):
  #   docker compose run --rm investigate --session <UUID> --requested-by "Nombre" --reason "Folio"
  investigate:
    <<: *rust-service
    profiles: [tools]
    restart: "no"
    image: sin-barreras/sb-admin:dev
    entrypoint: ["/sb-admin", "investigate"]
    healthcheck:
      disable: true
    environment:
      PG_HOST: postgres
      PG_DATABASE: sin_barreras
      PG_USER: sb_investigator
      PG_PASSWORD_FILE: /run/secrets/postgres_investigator_password
      PG_CA_FILE: /run/secrets/dev_ca
      RECORD_PRIVATE_KEYS_FILE: /run/secrets/record_private_key
    secrets: [postgres_investigator_password, record_private_key, dev_ca]

  pwa:
    <<: *hardening
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/pwa.Dockerfile
    image: sin-barreras/pwa:dev
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    labels:
      traefik.enable: "true"
      traefik.http.routers.pwa.rule: PathPrefix(`/`)
      traefik.http.routers.pwa.entrypoints: web
      traefik.http.routers.pwa.priority: "1"
      traefik.http.services.pwa.loadbalancer.server.port: "8080"

secrets:
  dev_ca:
    file: ./infra/dev/certs/ca.crt
  valkey_bff_password:
    file: ./infra/dev/secrets/valkey_bff_password
  valkey_admin_password:
    file: ./infra/dev/secrets/valkey_admin_password
  valkey_record_writer_password:
    file: ./infra/dev/secrets/valkey_record_writer_password
  c5_mock_api_key:
    file: ./infra/dev/secrets/c5_mock_api_key
  qr_keys:
    file: ./infra/dev/secrets/qr_keys
  record_public_key:
    file: ./infra/dev/secrets/record_public_key
  record_operational_keys:
    file: ./infra/dev/secrets/record_operational_keys
  record_private_key:
    file: ./infra/dev/secrets/record_private_key
  postgres_migrator_password:
    file: ./infra/dev/secrets/postgres_migrator_password
  postgres_record_writer_password:
    file: ./infra/dev/secrets/postgres_record_writer_password
  postgres_auditor_password:
    file: ./infra/dev/secrets/postgres_auditor_password
  postgres_reporting_password:
    file: ./infra/dev/secrets/postgres_reporting_password
  postgres_investigator_password:
    file: ./infra/dev/secrets/postgres_investigator_password
  postgres_replicator_password:
    file: ./infra/dev/secrets/postgres_replicator_password
  valkey_users_acl:
    file: ./infra/dev/secrets/valkey-users.acl
  valkey_healthcheck_password:
    file: ./infra/dev/secrets/valkey_healthcheck_password
  postgres_superuser_password:
    file: ./infra/dev/secrets/postgres_superuser_password

volumes:
  valkey-data:
  postgres-data:
