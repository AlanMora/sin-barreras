[workspace]
resolver = "3"
members = ["apps/bff", "apps/record-writer", "apps/c5-mock", "apps/sb-admin", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# Versiones centralizadas: cada crate las hereda con `workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "timeout", "set-header"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

aes-gcm = "0.11.1"
base64 = "0.23.1"
fred = { version = "10.1.0", default-features = false, features = ["i-std", "i-scripts", "subscriber-client", "enable-rustls", "sha-1"] }
futures = "0.3.34"
hmac = "0.13.0"
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
prometheus-client = "0.25.1"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "aes", "hkdfsha2", "getrandom"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "migrate", "macros", "uuid", "time", "json"] }
subtle = "2.6.1"
testcontainers-modules = { version = "0.15.0", features = ["valkey", "postgres"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio-tungstenite = "0.30.0"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1.27.0", features = ["v4", "v5", "v7", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }

crypto = { path = "crates/crypto" }
events = { path = "crates/events" }
registry = { path = "crates/registry" }
protocol = { path = "crates/protocol" }
service-kit = { path = "crates/service-kit" }
valkey-client = { path = "crates/valkey-client" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
