# Ajustes de Postgres para Sin Barreras (se carga además de los valores por
# defecto de la imagen oficial mediante `config_file` → include).

listen_addresses = '*'

# --- TLS obligatorio -----------------------------------------------------
ssl = on
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'
ssl_ca_file = '/etc/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

# --- Durabilidad: ningún commit confirmado se pierde ---------------------
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica

# --- Replicación de streaming hacia la réplica ------------------------------
max_wal_senders = 10
max_replication_slots = 10
# Un slot evita que el primario borre WAL que la réplica aún necesita; este
# límite evita que una réplica caída llene el disco del primario.
max_slot_wal_keep_size = '10GB'
wal_keep_size = '1GB'
hot_standby = on

# --- Registro de operación (sin datos sensibles: los valores van cifrados) -
log_connections = 'authorization'
log_disconnections = on
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# Ajustes que genera el arranque (archivado de WAL con pgBackRest en el primario).
include_dir = '/etc/postgresql/conf.d'
