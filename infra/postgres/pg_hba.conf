# Autenticación de clientes de Postgres para Sin Barreras.
#
# - Dentro del contenedor (socket local): solo los usuarios del sistema
#   `postgres` y `root` (healthcheck, `docker exec`) como rol `postgres`,
#   mediante peer + el mapa `local_admin` de pg_ident.conf.
# - Por red: SOLO TLS (hostssl) con SCRAM-SHA-256. Cualquier conexión sin TLS
#   se rechaza explícitamente.
#
# TYPE      DATABASE  USER  ADDRESS      METHOD
local       all       postgres           peer map=local_admin
hostssl     all       all   0.0.0.0/0    scram-sha-256
hostssl     all       all   ::/0         scram-sha-256
hostnossl   all       all   0.0.0.0/0    reject
hostnossl   all       all   ::/0         reject
