# Alertmanager: a dónde avisar. Configurar los receptores reales del equipo
# de guardia (correo institucional, webhook a la mesa de servicio, etc.).
route:
  receiver: guardia
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers: [severity="critical"]
      receiver: guardia
      repeat_interval: 30m

receivers:
  - name: guardia
    webhook_configs:
      # Reemplazar por el webhook del sistema de guardia (variable de despliegue).
      - url: http://alert-sink.invalid/sin-barreras
        send_resolved: true
