# Prometheus: métricas técnicas de Sin Barreras. Los endpoints /metrics solo
# son accesibles dentro de la red interna (Traefik no los publica).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # En Swarm `tasks.<servicio>` resuelve a TODAS las réplicas.
  - job_name: bff
    dns_sd_configs:
      - names: ["tasks.bff"]
        type: A
        port: 8080
  - job_name: record-writer
    dns_sd_configs:
      - names: ["tasks.record-writer"]
        type: A
        port: 8081
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
