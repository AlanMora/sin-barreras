# Sirve la PWA estática. TLS lo termina Traefik delante de este contenedor.

# POLÍTICA: los logs nunca contienen la IP del ciudadano. Este formato omite
# $remote_addr y $http_x_forwarded_for a propósito.
log_format sb_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent '
                   '$request_time "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    access_log /dev/stdout sb_noip;
    log_not_found off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los source maps se generan para depurar pero no se publican.
    location ~ \.map$ {
        return 404;
    }

    # Archivos con hash en el nombre: inmutables.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # El service worker y el manifest deben revalidarse siempre para que una
    # corrección urgente llegue de inmediato a todos los teléfonos.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Navegación de la SPA: siempre index.html, revalidado.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
