# Cabeceras de seguridad comunes. Se incluyen en CADA location porque Nginx
# descarta los add_header heredados cuando una location define los suyos.
#
# CSP estricta: solo recursos del propio origen, sin scripts ni estilos en
# línea, sin marcos, sin plugins. El WebSocket y el API van al mismo origen.
# Si se integra un componente de video en <iframe>, agregar su origen a
# frame-src (ver docs/videollamada.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$host ws://$host; manifest-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), interest-cohort=()" always;
