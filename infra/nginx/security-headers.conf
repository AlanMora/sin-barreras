# Cabeceras de seguridad comunes. Se incluyen en CADA location porque Nginx
# descarta los add_header heredados cuando una location define los suyos.
# La CSP estricta se completa en la Fase 7, cuando existan WS/API definitivos.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), interest-cohort=()" always;
