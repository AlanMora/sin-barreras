# Configuración de Valkey para Sin Barreras (compartida por desarrollo y Swarm).
#
# Valkey guarda tres cosas críticas: sesiones, la cola de reconexión y el
# stream de eventos que record-writer persiste en Postgres. Por eso:
#   1. Nunca expulsa llaves por memoria (noeviction): un evento expulsado sería
#      un registro perdido. Si la memoria se llena, las escrituras fallan de
#      forma visible y la alerta lo detecta.
#   2. Persistencia AOF activada, para sobrevivir a reinicios.
#   3. Solo TLS; el puerto en claro está deshabilitado.

# --- Red y TLS -----------------------------------------------------------
port 0
tls-port 6379
tls-cert-file /tls/valkey.crt
tls-key-file /tls/valkey.key
tls-ca-cert-file /tls/ca.crt
tls-protocols "TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes
# Autenticación de clientes por usuario y contraseña (ACL). Los certificados de
# cliente (mTLS) se evalúan para producción en la Fase 8.
tls-auth-clients no
protected-mode yes

# --- Autenticación (ACL) -------------------------------------------------
aclfile /tls/users.acl

# --- Memoria -------------------------------------------------------------
maxmemory-policy noeviction

# --- Persistencia --------------------------------------------------------
dir /data
appendonly yes
appenddirname "appendonlydir"
# everysec: como máximo ~1 s de escrituras en riesgo ante una caída del nodo.
# El BFF cubre esa ventana con WAITAOF para eventos del registro (ver ADR-0003).
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# Instantáneas RDB adicionales como segunda red de seguridad.
save 900 1 300 100 60 10000

# --- Operación -----------------------------------------------------------
loglevel notice
latency-tracking yes
