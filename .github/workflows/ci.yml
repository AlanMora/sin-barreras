name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio para el token del workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Las acciones se fijan por SHA de commit (no por tag) para que nadie pueda
# alterar lo que ejecuta el CI moviendo un tag. Dependabot las actualiza.
jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup lee rust-toolchain.toml e instala la versión fijada.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  pwa:
    name: PWA (lint, tipos, tests, build + presupuesto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # El build falla si el bundle inicial supera 60 KB gzip.
      - run: pnpm build

  smoke:
    name: Smoke test (docker compose completo)
    runs-on: ubuntu-24.04
    needs: [rust, pwa]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: infra/dev/bootstrap.sh
      - name: Levantar todo y esperar a que esté sano
        run: docker compose --profile apps up -d --build --wait --wait-timeout 180
      - name: Verificar endpoints
        run: |
          curl -fsS http://127.0.0.1:8090/health; echo
          curl -fsS -o /dev/null http://127.0.0.1:8000/
      - name: Prueba de punta a punta del protocolo (Traefik → 2 réplicas del BFF → C5 simulado)
        run: node scripts/smoke-ws.mjs
      - name: Logs si algo falló
        if: failure()
        run: docker compose --profile apps logs --no-color
